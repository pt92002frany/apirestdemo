# ==========================================
# Configuración general de la aplicación
# ==========================================
spring.application.name=apirestdemo

# ==========================================
# Configuración del servidor
# ==========================================
server.port=8085
server.servlet.context-path=/api/v1/demoapirestdam235
app.version=1.0.0

# ==========================================
# Configuración de la conexión a MariaDB
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/DBTmp
spring.datasource.username=root
spring.datasource.password=vialactea
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# Configuración de Hibernate/JPA
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Silenciar warning de open-in-view (no bloquea, solo aviso)
spring.jpa.open-in-view=false

# ==========================================
# Configuración de logs
# ==========================================
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE